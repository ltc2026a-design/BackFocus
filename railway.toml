# FocusFlow backend — configuración de despliegue en Railway
# https://docs.railway.app/deploy/config-as-code
#
# Los VALORES sensibles (JWT_SECRET, DATABASE_URL, SMTP_PASS, CORS_ORIGINS, etc.)
# se ponen en el panel: Service → Variables — NO en este archivo.

[build]
builder = "NIXPACKS"
# Prisma necesita generar el cliente antes de arrancar.
buildCommand = "npm install && npx prisma generate"

[deploy]
# El arranque NO toca la base: `prisma db push` se corre como comando puntual
# desde el shell del servicio cuando el schema cambia. Así el inicio depende solo
# del proceso Node y no falla si el Volumen está lento.
startCommand = "node --env-file-if-exists=.env server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
